name: Battlecode Autumn CLI Probe

on:
  push:
    paths:
      - '.github/workflows/battlecode-cli-probe.yml'
  workflow_dispatch:

jobs:
  inspect-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned Autumn CLI
        run: python -m pip install 'cambc==2.1.6'
      - name: Inspect actual available commands
        working-directory: battlecode-2026
        run: |
          cambc --help
          cambc run --help
          cambc test-run --help
